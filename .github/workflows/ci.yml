name: App checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check secure-proxy.js
      - run: node --check compliance-proxy.js
      - run: node --check public/app.js
      - run: node --check public/privacy-ui.js
      - run: node --check public/ux-location.js
      - run: node --check public/draft-security.js
      - run: node --check public/home-link.js
      - run: node --check public/severity-privacy-fix.js
      - run: node --check public/map-controls.js
      - run: node --check public/visual-polish.js
      - run: node --check public/compliance-ui.js
      - run: node --check public/pwa.js
      - run: node --check public/sw.js
      - run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8')); console.log('manifest ok')"
