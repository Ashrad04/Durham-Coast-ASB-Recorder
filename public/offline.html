<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163a34">
  <title>Incident Hub offline</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#17302b;background:#f3f7f5}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(460px,100%);background:#fff;border:1px solid #dfe7e3;border-radius:20px;padding:28px;box-sizing:border-box;box-shadow:0 18px 50px rgba(23,48,43,.08)}
    .mark{width:58px;height:58px;border-radius:16px;background:#163a34;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:18px}
    h1{font-size:24px;margin:0 0 10px}p{line-height:1.5;color:#5f716b;margin:0 0 20px}
    button{border:0;border-radius:12px;padding:12px 16px;background:#163a34;color:#fff;font-weight:800;font-size:15px}
    small{display:block;color:#75847f;margin-top:16px;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <div class="mark">DC</div>
    <h1>You’re offline</h1>
    <p>Reconnect to view or submit incident information.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Incident records, photos and precise locations are not stored for offline viewing.</small>
  </main>
</body>
</html>
